name: Multi-language tests

# Exercises the non-English paths that the default CI grid skips. The Turkish job installs
# spacy-stanza and downloads Stanza's Turkish model; the European job downloads the
# transformer spaCy pipelines for DE / ES / FR. Both run weekly and on tagged releases so
# regressions surface before users hit them.

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  turkish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bitig + Turkish extras
        run: uv pip install --system -e ".[turkish,embeddings,dev]"
      - name: Download Stanza Turkish model
        run: python -c "import stanza; stanza.download('tr')"
      - name: Fail if the Turkish pipeline cannot load
        run: python -c "import spacy_stanza; nlp = spacy_stanza.load_pipeline('tr'); assert len(nlp('Bir deneme cümlesi.')) > 0"
      - name: Run Turkish integration tests
        run: pytest -m slow tests/integration -v

  european:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv pip install --system -e ".[dev]"
      - name: Download spaCy pipelines (DE, ES, FR)
        run: |
          python -m spacy download de_dep_news_trf
          python -m spacy download es_dep_news_trf
          python -m spacy download fr_dep_news_trf
      - name: Parse a sentence with each pipeline (fails if any cannot load)
        run: |
          python - <<'PY'
          import spacy
          for model, text in [
              ("de_dep_news_trf", "Das ist ein kurzer Satz."),
              ("es_dep_news_trf", "Esta es una frase corta."),
              ("fr_dep_news_trf", "Ceci est une phrase courte."),
          ]:
              doc = spacy.load(model)(text)
              assert len(doc) > 0 and any(t.pos_ for t in doc), model
          PY
      - name: Run language readability unit tests
        run: pytest tests/languages -v
