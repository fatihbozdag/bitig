# Full Federalist Papers stylometric analysis
#
# Exploratory views of the 71 single-author papers (Hamilton 51, Madison 15,
# Jay 5): Burrows Delta (in-sample/resubstitution only), Zeta (contrastive
# vocabulary), PCA, Ward hierarchical clustering, and a small bootstrap
# consensus tree. The 11 disputed papers and the 3 joint papers are filtered
# out below, so this study does NOT attribute or plot the disputed papers;
# attribution is the separate `bitig delta` / `bitig bayesian` step in README.md.
#
# Usage:
#   bitig run examples/federalist/study.yaml --name demo
#   bitig report examples/federalist/results/demo --output examples/federalist/report.html

name: federalist-full
seed: 42

corpus:
  path: examples/federalist/corpus
  metadata: examples/federalist/metadata.tsv
  # Only analyse single-author papers; Joint_HM (18-20, role=excluded) and the
  # Disputed papers (role=test) are dropped from every method by this filter.
  filter:
    role: [train]

features:
  - id: mfw500
    type: mfw
    n: 500
    min_df: 2
    scale: zscore
    lowercase: true

methods:
  - id: burrows
    kind: delta
    variant: burrows
    features: mfw500
    group_by: author

  - id: pca
    kind: reduce
    features: mfw500
    n_components: 2

  - id: ward
    kind: cluster
    features: mfw500
    n_clusters: 3
    linkage: ward

  - id: zeta_hamilton_madison
    kind: zeta
    group_by: author
    group_a: Hamilton
    group_b: Madison
    top_k: 25

  - id: consensus
    kind: consensus
    mfw_bands: [100, 200, 300, 400, 500]
    replicates: 20
    subsample: 0.8
    seed: 42

viz:
  format: [pdf, png]
  dpi: 300

report:
  format: html
  title: "Federalist Papers — full stylometric analysis"

cache:
  dir: examples/federalist/.bitig/cache

output:
  dir: examples/federalist/results
  timestamp: false
